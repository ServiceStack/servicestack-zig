name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        zig-version: ['0.13.0', '0.14.0']
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Zig
      uses: goto-bus-stop/setup-zig@v2
      with:
        version: ${{ matrix.zig-version }}
    
    - name: Run tests
      run: zig build test
    
    - name: Build examples
      run: |
        zig build example
        zig build advanced
    
    - name: Check formatting
      run: zig fmt --check src/ examples/
