name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Zig
      uses: goto-bus-stop/setup-zig@v2
      with:
        version: 0.11.0
    
    - name: Build
      run: zig build
    
    - name: Run tests
      run: zig build test
    
    - name: Build examples
      run: |
        zig build-exe examples/basic.zig -femit-bin=zig-out/bin/basic
        zig build-exe examples/advanced.zig -femit-bin=zig-out/bin/advanced
